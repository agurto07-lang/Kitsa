<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --negro: #0a0a0a;
    --negro-soft: #161616;
    --blanco: #f7f5f0;
    --papel: #f3efe4;
    --papel-dark: #e4dcc4;
    --ink: #1a1a1a;

    --dorado: #c9a13b;
    --dorado-dark: #8a6c22;
    --dorado-light: #ecd08a;

    --input-bg: #faf8f2;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    font-family: 'EB Garamond', serif;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(201,161,59,0.14), transparent 45%),
      radial-gradient(ellipse at 85% 10%, rgba(201,161,59,0.10), transparent 45%),
      radial-gradient(ellipse at 50% 100%, rgba(201,161,59,0.08), transparent 55%),
      radial-gradient(ellipse at 50% 50%, #1c1c1c 0%, #101010 60%, #050505 100%);
    min-height: 100vh;
    color: var(--blanco);
    position: relative;
    overflow-x: hidden;
    padding: 24px 12px;
  }
  @media (min-width: 640px){ body{ padding: 40px 16px; } }

  .font-display{ font-family: 'Cinzel Decorative', serif; }
  .font-heading{ font-family: 'Cinzel', serif; }

  .spark{
    position: fixed;
    bottom: -10px;
    border-radius: 50%;
    opacity: 0.75;
    pointer-events: none;
    animation: rise linear infinite;
    z-index: 0;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) scale(1); opacity: 0.85;}
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)) scale(0.3); opacity: 0;}
  }

  .glow{ filter: drop-shadow(0 0 18px rgba(201,161,59,0.55)) drop-shadow(0 0 40px rgba(201,161,59,0.35)); }

  .page{ position: relative; z-index: 10; max-width: 1152px; margin: 0 auto; }

  .panel-surface{
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.06), transparent 45%),
      linear-gradient(135deg, #faf7ee 0%, #f0eadb 40%, #f3efe4 60%, #e4dcc4 100%);
    color: var(--ink);
    border: 2px solid var(--dorado);
    border-radius: 16px;
    box-shadow:
      0 0 0 6px rgba(10,10,10,0.65),
      0 0 0 8px var(--dorado),
      0 25px 60px -15px rgba(0,0,0,0.7),
      inset 0 0 60px rgba(201,161,59,0.10);
    position: relative;
  }

  .divider-line{
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--dorado) 15%, var(--dorado-light) 50%, var(--dorado) 85%, transparent);
    border-radius: 999px;
    margin: 16px auto;
  }

  /* ---------- Header ---------- */
  .header-banner{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,161,59,0.20), transparent 60%),
      linear-gradient(180deg, #171717 0%, #0a0a0a 100%);
    border-bottom: 3px solid var(--dorado);
    border-radius: 16px;
    padding: 24px 16px;
    margin-bottom: 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 768px){ .header-banner{ padding: 40px 48px; margin-bottom: 32px; } }
  .header-icon{ width: 44px; height: 44px; margin: 0 auto 12px; display: block; }
  @media (min-width: 768px){ .header-icon{ width: 52px; height: 52px; } }

  .header-brand{ letter-spacing: 0.30em; color: var(--dorado-light); font-size: 12px; margin-bottom: 8px; }
  @media (min-width: 768px){ .header-brand{ font-size: 14px; } }

  .header-title{
    color: var(--dorado-light);
    font-size: 28px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  @media (min-width: 768px){ .header-title{ font-size: 44px; } }

  .header-divider{ width: 160px; }
  @media (min-width: 768px){ .header-divider{ width: 256px; } }

  .header-tagline{ color: var(--blanco); font-size: 12px; letter-spacing: 0.05em; opacity: 0.9; }
  @media (min-width: 768px){ .header-tagline{ font-size: 16px; } }

  /* ---------- Stats ---------- */
  .stats-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
  @media (min-width: 640px){ .stats-grid{ gap: 16px; } }
  @media (min-width: 768px){ .stats-grid{ grid-template-columns: repeat(4, 1fr); margin-bottom: 32px; } }

  .stat-card{ border-radius: 12px; padding: 16px; text-align: center; border: 2px solid var(--dorado); }
  .stat-icon{ font-size: 20px; margin-bottom: 4px; }
  .stat-value{ font-size: 24px; color: var(--negro); }
  @media (min-width: 768px){ .stat-value{ font-size: 30px; } }
  .stat-label{ font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.75; margin-top: 4px; }
  @media (min-width: 768px){ .stat-label{ font-size: 12px; } }

  /* ---------- Panel principal ---------- */
  .panel{ padding: 14px; }
  @media (min-width: 640px){ .panel{ padding: 20px; } }
  @media (min-width: 768px){ .panel{ padding: 32px; } }

  .panel-title-row{ display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
  @media (min-width: 640px){ .panel-title-row{ gap: 12px; } }
  @media (min-width: 768px){ .panel-title-row{ margin-bottom: 24px; } }

  .panel-icon{ font-size: 20px; color: var(--dorado-dark); }
  @media (min-width: 640px){ .panel-icon{ font-size: 24px; } }
  @media (min-width: 768px){ .panel-icon{ font-size: 30px; } }

  .panel-title{ font-size: 20px; text-align: center; }
  @media (min-width: 640px){ .panel-title{ font-size: 24px; } }
  @media (min-width: 768px){ .panel-title{ font-size: 30px; } }

  /* ---------- Controles ---------- */
  .controls{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  @media (min-width: 640px){ .controls{ gap: 12px; } }
  @media (min-width: 768px){ .controls{ flex-direction: row; gap: 16px; margin-bottom: 24px; } }

  .search-wrap{ position: relative; flex: 1; }
  .search-icon{ position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dorado-dark); }
  .search-input{
    width: 100%; padding: 10px 16px 10px 40px; border-radius: 8px;
    border: 2px solid var(--dorado); background: var(--input-bg); color: var(--ink);
    font-size: 14px; font-weight: 500; font-family: inherit;
  }
  @media (min-width: 640px){ .search-input{ font-size: 16px; } }
  .search-input::placeholder{ color: rgba(26,26,26,0.5); font-style: italic; }

  .filter-wrap{ position: relative; }
  @media (min-width: 768px){ .filter-wrap{ width: 256px; } }
  .filter-select{
    width: 100%; padding: 10px 32px 10px 16px; border-radius: 8px;
    border: 2px solid var(--dorado); background: var(--input-bg); color: var(--ink);
    font-family: 'Cinzel', serif; font-size: 12px; appearance: none; cursor: pointer;
  }
  @media (min-width: 640px){ .filter-select{ font-size: 14px; } }
  .filter-arrow{ position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--dorado-dark); }

  select:focus, input:focus{ outline: none; box-shadow: 0 0 0 3px rgba(201,161,59,0.35); }

  /* ---------- Tabla (escritorio) ---------- */
  .table-wrap{ display: none; overflow-x: auto; border-radius: 12px; border: 2px solid var(--dorado); }
  @media (min-width: 768px){ .table-wrap{ display: block; } }
  .table-wrap::-webkit-scrollbar{ width:10px; height:10px; }
  .table-wrap::-webkit-scrollbar-track{ background: rgba(26,26,26,0.08); border-radius: 10px;}
  .table-wrap::-webkit-scrollbar-thumb{ background: linear-gradient(180deg,var(--dorado-light),var(--dorado-dark)); border-radius: 10px;}

  .att-table{ width: 100%; font-size: 14px; border-collapse: collapse; }
  @media (min-width: 768px){ .att-table{ font-size: 16px; } }

  .att-table thead tr{
    background: linear-gradient(90deg, var(--negro), var(--negro-soft));
    color: var(--dorado-light);
    font-family: 'Cinzel', serif;
  }
  .att-table th{ text-align: left; padding: 12px 16px; white-space: nowrap; }
  .att-table th.col-center{ text-align: center; }

  .att-table td{ padding: 12px 16px; }
  .att-table tbody tr{ border-top: 1px solid rgba(201,161,59,0.3); transition: background-color .15s ease; }
  .att-table tbody tr:hover{ background: rgba(201,161,59,0.08); }

  .col-index{ font-family: 'Cinzel', serif; font-size: 12px; opacity: 0.6; }
  .col-name{ font-weight: 600; }
  .col-attend{ text-align: center; }
  .events-cell{ display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- Tarjetas (móvil) ---------- */
  .card-list{ display: flex; flex-direction: column; gap: 10px; }
  @media (min-width: 768px){ .card-list{ display: none; } }

  .p-card{
    border-radius: 12px; border: 2px solid var(--dorado); background: var(--input-bg);
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .p-card-top{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .p-card-name-wrap{ display: flex; align-items: center; gap: 8px; min-width: 0; }
  .p-card-index{ font-family: 'Cinzel', serif; font-size: 11px; opacity: 0.5; flex-shrink: 0; }
  .p-card-name{ font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-card-badges{ display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- Badges de eventos ---------- */
  .badge-event{
    background: linear-gradient(135deg, var(--negro) 0%, var(--negro-soft) 100%);
    color: #ffffff;
    border: 1px solid var(--dorado);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  @media (min-width: 768px){ .badge-event{ font-size: 12px; } }
  .badge-event.small{ font-size: 10px; padding: 2px 8px; }

  .badge-none{
    background: rgba(26,26,26,0.08);
    color: rgba(26,26,26,0.55);
    border: 1px dashed rgba(26,26,26,0.35);
    font-size: 11px; padding: 4px 10px; border-radius: 999px; font-style: italic;
  }
  @media (min-width: 768px){ .badge-none{ font-size: 12px; } }
  .badge-none.small{ font-size: 10px; padding: 2px 8px; }

  /* ---------- Pill de asistencias ---------- */
  .attend-pill{
    font-family: 'Cinzel', serif; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; width: 36px; height: 36px;
  }
  .attend-pill.small{ width: 32px; height: 32px; font-size: 14px; flex-shrink: 0; }
  .attend-3{ background: linear-gradient(135deg,var(--negro),var(--negro-soft)); color: var(--dorado-light); box-shadow: 0 0 12px rgba(201,161,59,0.5); border: 1px solid var(--dorado);}
  .attend-2{ background: linear-gradient(135deg,var(--dorado-dark),var(--dorado)); color:#1a1a1a;}
  .attend-1{ background: linear-gradient(135deg,var(--dorado),var(--dorado-light)); color:#1a1a1a;}
  .attend-0{ background: rgba(26,26,26,0.08); color:rgba(26,26,26,0.5); border:1px dashed rgba(26,26,26,0.3);}

  /* ---------- Estado vacío ---------- */
  .empty-state{ display: none; text-align: center; padding: 40px 0; opacity: 0.7; font-family: 'Cinzel', serif; }
  .empty-state.visible{ display: block; }

  /* ---------- Paginación ---------- */
  .pagination-bar{ display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
  @media (min-width: 640px){ .pagination-bar{ flex-direction: row; gap: 16px; } }
  @media (min-width: 768px){ .pagination-bar{ margin-top: 24px; } }

  .results-info{ font-size: 12px; font-family: 'Cinzel', serif; opacity: 0.8; text-align: center; }
  @media (min-width: 640px){ .results-info{ font-size: 14px; } }

  .pagination{ display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; }
  @media (min-width: 640px){ .pagination{ gap: 6px; } }

  .page-btn{
    font-family: 'Cinzel', serif; transition: all .15s ease; padding: 6px 10px; border-radius: 8px;
    border: 2px solid var(--dorado); background: var(--input-bg); color: var(--ink);
    font-size: 12px; cursor: pointer;
  }
  @media (min-width: 640px){ .page-btn{ padding: 6px 14px; font-size: 14px; } }
  .page-btn:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 4px 10px rgba(201,161,59,0.35); }
  .page-btn:disabled{ opacity: 0.35; cursor: not-allowed; }
  .page-btn.active{
    background: linear-gradient(135deg, var(--negro), var(--negro-soft));
    color: var(--dorado-light);
    border-color: var(--dorado);
  }
  .page-ellipsis{ padding: 0 6px; font-family: 'Cinzel', serif; opacity: 0.6; font-size: 12px; }
  @media (min-width: 640px){ .page-ellipsis{ font-size: 14px; } }

  /* ---------- Footer ---------- */
  .footer{ text-align: center; margin-top: 32px; margin-bottom: 16px; }
  @media (min-width: 768px){ .footer{ margin-top: 40px; } }
  .footer-divider{ width: 128px; }
  @media (min-width: 640px){ .footer-divider{ width: 160px; } }
  @media (min-width: 768px){ .footer-divider{ width: 256px; } }
  .footer-text{ font-size: 16px; color: var(--dorado-light); padding: 0 8px; }
  @media (min-width: 640px){ .footer-text{ font-size: 18px; } }
  @media (min-width: 768px){ .footer-text{ font-size: 20px; } }
  .footer-heart{ margin-top: 4px; color: var(--dorado); }
</style>
</head>
<body>

<div id="sparks"></div>

<div class="page">

  <!-- Header -->
  <div class="header-banner">
    <svg class="header-icon glow" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 4C28 14 18 16 14 26C10 36 16 46 24 50C20 44 20 38 24 34C22 42 26 48 32 52C38 48 42 42 40 34C44 38 44 44 40 50C48 46 54 36 50 26C46 16 36 14 32 4Z" fill="url(#g1)"/>
      <defs>
        <linearGradient id="g1" x1="14" y1="4" x2="50" y2="52" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f5e6b0"/>
          <stop offset="0.5" stop-color="#c9a13b"/>
          <stop offset="1" stop-color="#0a0a0a"/>
        </linearGradient>
      </defs>
    </svg>
    <p class="header-brand font-heading">FÉNRIX · CAMINO KITSA</p>
    <h1 class="header-title font-display">Reporte de Asistencia</h1>
    <div class="divider-line header-divider"></div>
    <p class="header-tagline font-heading">REGISTRO DE ASISTENCIA A EVENTOS</p>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="stats"></div>

  <!-- Panel -->
  <div class="panel-surface panel">
    <div style="position:relative;">
      <div class="panel-title-row">
        <span class="panel-icon">✦</span>
        <h2 class="panel-title font-display">Cuadro de Asistencia</h2>
        <span class="panel-icon">✦</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="text" placeholder="Buscar por nombre..." class="search-input">
        </div>
        <div class="filter-wrap">
          <select id="eventFilter" class="filter-select">
            <option value="">Todos los eventos</option>
          </select>
          <span class="filter-arrow">▾</span>
        </div>
      </div>

      <!-- Vista de tabla (escritorio / tablet) -->
      <div class="table-wrap">
        <table class="att-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Participante</th>
              <th class="col-center">Asistencias</th>
              <th>Eventos</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Vista de tarjetas (móvil) -->
      <div id="cardList" class="card-list"></div>

      <div id="emptyState" class="empty-state">
        No se encontraron participantes con esos filtros.
      </div>

      <!-- Pagination -->
      <div class="pagination-bar">
        <p id="resultsInfo" class="results-info"></p>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="divider-line footer-divider"></div>
    <p class="footer-text font-display">Gracias por su participación</p>
    <p class="footer-heart">❤</p>
  </div>

</div>

<script>
// ---------- Datos (nombres corregidos de encoding; DNI se conserva en los datos pero no se muestra) ----------
const rawData = [
  ["73264263","Alexander Limachi Laura",2,["Cine","Lúdico"]],
  ["77209068","Miguel Pinto",2,["Voley Fénix","Zumba"]],
  ["47579943","Andy Jhoel Conche Rojas",1,["Charla Psicológica"]],
  ["76774434","David Iván Trujillo Rodríguez",1,["Picnic Verdad o Reto"]],
  ["75328785","Roger Fabrizio Galarce Chávez",1,["Picnic Verdad o Reto"]],
  ["74357918","César Martín Vera Estela",0,[]],
  ["74935082","Diego Abad",0,[]],
  ["71009592","Eickson Rojas Lara",0,[]],
  ["48876554","Enrique Guerrero Alfaro",0,[]],
  ["72569263","Juan Pablo Solis",0,[]],
  ["73478994","Leonardo Mori",0,[]],
  ["72158036","Luis Delgado",0,[]],
  ["73257283","Piero Alvarado",0,[]]
];

// Formato para privacidad: primeros 2 nombres completos + iniciales del resto
function shortenName(nombre){
  const words = nombre.trim().split(/\s+/).filter(Boolean);
  if(words.length <= 2) return words.join(' ');
  const primeros = words.slice(0, 2).join(' ');
  const iniciales = words.slice(2).map(w => w.charAt(0).toUpperCase() + '.').join(' ');
  return `${primeros} ${iniciales}`;
}

const data = rawData.map(([dni, nombre, asistencias, eventos]) => ({
  dni, nombre: shortenName(nombre), asistencias, eventos
}));

// ---------- Estado ----------
let state = { search: '', event: '', page: 1, perPage: 10 };

// ---------- Poblar filtro de eventos ----------
const allEvents = Array.from(new Set(data.flatMap(d => d.eventos))).sort();
const eventFilter = document.getElementById('eventFilter');
allEvents.forEach(ev => {
  const opt = document.createElement('option');
  opt.value = ev; opt.textContent = ev;
  eventFilter.appendChild(opt);
});

// ---------- Stats ----------
function renderStats(){
  const total = data.length;
  const conAsistencia = data.filter(d => d.asistencias > 0).length;
  const sinAsistencia = total - conAsistencia;
  const totalAsistencias = data.reduce((a,d)=>a+d.asistencias,0);
  const stats = [
    { label: 'Participantes', value: total, icon: '👥' },
    { label: 'Con Asistencia', value: conAsistencia, icon: '✔️' },
    { label: 'Sin Asistencia', value: sinAsistencia, icon: '✖️' },
    { label: 'Total Asistencias', value: totalAsistencias, icon: '★' },
  ];
  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="panel-surface stat-card">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-value font-display">${s.value}</div>
      <div class="stat-label font-heading">${s.label}</div>
    </div>
  `).join('');
}

// ---------- Filtrado (por nombre, el DNI ya no se muestra ni se busca) ----------
function getFiltered(){
  return data.filter(d => {
    const matchesSearch = d.nombre.toLowerCase().includes(state.search.toLowerCase());
    const matchesEvent = !state.event || d.eventos.includes(state.event);
    return matchesSearch && matchesEvent;
  });
}

function attendClass(n){
  if(n >= 3) return 'attend-3';
  if(n === 2) return 'attend-2';
  if(n === 1) return 'attend-1';
  return 'attend-0';
}

// ---------- Render tabla + tarjetas ----------
function render(){
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.perPage));
  if(state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * state.perPage;
  const pageItems = filtered.slice(start, start + state.perPage);

  const tbody = document.getElementById('tableBody');
  const cardList = document.getElementById('cardList');
  const emptyState = document.getElementById('emptyState');

  if(pageItems.length === 0){
    tbody.innerHTML = '';
    cardList.innerHTML = '';
    emptyState.classList.add('visible');
  } else {
    emptyState.classList.remove('visible');

    tbody.innerHTML = pageItems.map((d, i) => `
      <tr>
        <td class="col-index">${start + i + 1}</td>
        <td class="col-name">${d.nombre}</td>
        <td class="col-attend">
          <span class="attend-pill ${attendClass(d.asistencias)}">${d.asistencias}</span>
        </td>
        <td>
          <div class="events-cell">
            ${ d.eventos.length
                ? d.eventos.map(ev => `<span class="badge-event">${ev}</span>`).join('')
                : `<span class="badge-none">Sin registro</span>`
            }
          </div>
        </td>
      </tr>
    `).join('');

    cardList.innerHTML = pageItems.map((d, i) => `
      <div class="p-card">
        <div class="p-card-top">
          <div class="p-card-name-wrap">
            <span class="p-card-index font-heading">${start + i + 1}</span>
            <span class="p-card-name">${d.nombre}</span>
          </div>
          <span class="attend-pill small ${attendClass(d.asistencias)}">${d.asistencias}</span>
        </div>
        <div class="p-card-badges">
          ${ d.eventos.length
              ? d.eventos.map(ev => `<span class="badge-event small">${ev}</span>`).join('')
              : `<span class="badge-none small">Sin registro</span>`
          }
        </div>
      </div>
    `).join('');
  }

  document.getElementById('resultsInfo').textContent =
    filtered.length === 0 ? '' : `Mostrando ${start+1}–${Math.min(start+state.perPage, filtered.length)} de ${filtered.length} participantes`;

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML=''; return; }
  let html = '';
  html += `<button class="page-btn" ${state.page===1?'disabled':''} data-page="${state.page-1}">‹</button>`;

  const pages = [];
  for(let p=1; p<=totalPages; p++){
    if(p===1 || p===totalPages || Math.abs(p-state.page)<=1) pages.push(p);
    else if(pages[pages.length-1] !== '...') pages.push('...');
  }
  pages.forEach(p => {
    if(p === '...'){
      html += `<span class="page-ellipsis">…</span>`;
    } else {
      html += `<button class="page-btn ${p===state.page?'active':''}" data-page="${p}">${p}</button>`;
    }
  });

  html += `<button class="page-btn" ${state.page===totalPages?'disabled':''} data-page="${state.page+1}">›</button>`;
  el.innerHTML = html;

  el.querySelectorAll('button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.page = parseInt(btn.dataset.page);
      render();
      document.querySelector('.panel-surface').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

// ---------- Eventos UI ----------
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  state.page = 1;
  render();
});
document.getElementById('eventFilter').addEventListener('change', (e) => {
  state.event = e.target.value;
  state.page = 1;
  render();
});

// ---------- Partículas de fondo (dorado) ----------
function spawnSparks(){
  const container = document.getElementById('sparks');
  const colors = ['#c9a13b','#ecd08a','#f5e6b0'];
  const count = window.innerWidth < 640 ? 14 : 26;
  for(let i=0;i<count;i++){
    const e = document.createElement('div');
    const size = 3 + Math.random()*6;
    const color = colors[i % colors.length];
    e.className = 'spark';
    e.style.width = size+'px';
    e.style.height = size+'px';
    e.style.left = Math.random()*100+'vw';
    e.style.background = `radial-gradient(circle, ${color} 0%, ${color}55 45%, transparent 75%)`;
    e.style.setProperty('--drift', (Math.random()*80-40)+'px');
    e.style.animationDuration = (6+Math.random()*8)+'s';
    e.style.animationDelay = (Math.random()*10)+'s';
    container.appendChild(e);
  }
}

renderStats();
render();
spawnSparks();
</script>
